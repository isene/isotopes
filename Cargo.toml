[package]
name = "isotopes"
version = "0.1.3"
edition = "2021"
authors = ["Geir Isene <g@isene.com>"]
description = "The chart of the isotopes in your terminal: 3,386 nuclides, their decay modes, half-lives and decay chains. Part of the Fe2O3 suite."
license = "Unlicense"
repository = "https://github.com/isene/isotopes"

[dependencies]
crust = { version = "0.1.46", path = "../crust", package = "fe2o3-crust" }

[profile.release]
opt-level = 3
lto = true
strip = true
