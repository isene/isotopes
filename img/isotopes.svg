<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#0a0a14"/>
    </linearGradient>
    <linearGradient id="rust" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f74c00"/>
      <stop offset="100%" style="stop-color:#b7410e"/>
    </linearGradient>
  </defs>
  <style>
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }
    .decay { animation: pulse 2.4s ease-in-out infinite; }
    .decay2 { animation: pulse 2.4s ease-in-out 0.8s infinite; }
  </style>

  <circle cx="128" cy="128" r="120" fill="url(#bg)" stroke="url(#rust)" stroke-width="3"/>

  <!-- Axes: neutrons across, protons up -->
  <g stroke="#4a4a5e" stroke-width="1.5" fill="none">
    <path d="M 52 186 L 206 186"/>
    <path d="M 52 186 L 52 56"/>
  </g>
  <text x="206" y="200" font-family="monospace" font-size="11" fill="#7a7a90" text-anchor="end">N</text>
  <text x="44"  y="60"  font-family="monospace" font-size="11" fill="#7a7a90" text-anchor="end">Z</text>

  <!-- The valley of stability: white down the middle, beta-minus blue
       below it, beta-plus red above, alpha gold at the heavy end -->
  <g>
    <!-- stable ridge -->
    <g fill="#f5f5f5">
      <rect x="60"  y="176" width="7" height="7"/>
      <rect x="70"  y="169" width="7" height="7"/>
      <rect x="80"  y="162" width="7" height="7"/>
      <rect x="91"  y="155" width="7" height="7"/>
      <rect x="102" y="148" width="7" height="7"/>
      <rect x="114" y="141" width="7" height="7"/>
      <rect x="126" y="134" width="7" height="7"/>
      <rect x="139" y="127" width="7" height="7"/>
      <rect x="152" y="120" width="7" height="7"/>
      <rect x="166" y="113" width="7" height="7"/>
    </g>
    <!-- neutron-rich side: beta minus -->
    <g fill="#5a96ff">
      <rect x="70"  y="176" width="7" height="7"/>
      <rect x="80"  y="169" width="7" height="7"/>
      <rect x="91"  y="162" width="7" height="7"/>
      <rect x="102" y="155" width="7" height="7"/>
      <rect x="114" y="148" width="7" height="7"/>
      <rect x="126" y="141" width="7" height="7"/>
      <rect x="139" y="134" width="7" height="7"/>
      <rect x="152" y="127" width="7" height="7"/>
      <rect x="166" y="120" width="7" height="7"/>
      <rect x="180" y="113" width="7" height="7"/>
      <rect x="91"  y="169" width="7" height="7" opacity="0.65"/>
      <rect x="114" y="155" width="7" height="7" opacity="0.65"/>
      <rect x="139" y="141" width="7" height="7" opacity="0.65"/>
      <rect x="166" y="127" width="7" height="7" opacity="0.65"/>
    </g>
    <!-- proton-rich side: beta plus / electron capture -->
    <g fill="#ff695a">
      <rect x="60"  y="169" width="7" height="7"/>
      <rect x="70"  y="162" width="7" height="7"/>
      <rect x="80"  y="155" width="7" height="7"/>
      <rect x="91"  y="148" width="7" height="7"/>
      <rect x="102" y="141" width="7" height="7"/>
      <rect x="114" y="134" width="7" height="7"/>
      <rect x="126" y="127" width="7" height="7"/>
      <rect x="139" y="120" width="7" height="7"/>
      <rect x="152" y="113" width="7" height="7"/>
      <rect x="80"  y="148" width="7" height="7" opacity="0.65"/>
      <rect x="102" y="134" width="7" height="7" opacity="0.65"/>
      <rect x="126" y="120" width="7" height="7" opacity="0.65"/>
    </g>
    <!-- the heavy end, where alpha takes over -->
    <g fill="#ffcd46">
      <rect x="166" y="106" width="7" height="7"/>
      <rect x="180" y="106" width="7" height="7"/>
      <rect x="180" y="99"  width="7" height="7"/>
      <rect x="194" y="99"  width="7" height="7" class="decay2"/>
      <rect x="194" y="92"  width="7" height="7"/>
      <rect x="180" y="92"  width="7" height="7" opacity="0.7"/>
    </g>
  </g>

  <!-- One alpha step: down two protons, down two neutrons -->
  <g class="decay">
    <path d="M 197 90 L 172 104" stroke="#ffcd46" stroke-width="2.2"
          fill="none" stroke-linecap="round" marker-end="url(#none)"/>
    <circle cx="171" cy="105" r="3.4" fill="#ffcd46"/>
  </g>

  <text x="128" y="218" font-family="monospace" font-size="21" font-weight="bold"
        fill="url(#rust)" text-anchor="middle" letter-spacing="1">isotopes</text>
  <text x="128" y="232" font-family="monospace" font-size="7.5" fill="#888"
        text-anchor="middle">the chart of the nuclides</text>
</svg>
